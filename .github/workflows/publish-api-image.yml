name: Publish API image

# Builds the API from main and pushes it to GitHub Container Registry. Each image is tagged with
# its commit, so any earlier build can be redeployed by tag.

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/publish-api-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # A plain image manifest, so hosts that pull by tag don't need attestation support.
          provenance: false
          tags: |
            ghcr.io/ethanyap123/pulse-api:latest
            ghcr.io/ethanyap123/pulse-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
