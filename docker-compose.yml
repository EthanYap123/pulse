# Local Postgres for the API and integration tests.
# Start: docker compose up -d    Stop: docker compose down    Reset data: docker compose down -v
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      # Host port 5434 avoids clashing with a native Postgres on 5432 and
      # with other local projects (SG Transit uses 5433).
      # Override with PULSE_DB_PORT if 5434 is taken too.
      - "${PULSE_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
