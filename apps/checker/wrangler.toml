name = "pulse-checker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# node-postgres (local DB_DRIVER=pg) needs Node's socket APIs.
compatibility_flags = ["nodejs_compat"]

# Every 5 minutes (see docs/adr/0001-worker-cron-instead-of-a-queue.md).
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# Five shards, each a SQLite-backed Durable Object (docs/adr/0004-buffer-checks-in-durable-objects.md).
[[durable_objects.bindings]]
name = "SHARD"
class_name = "Shard"

# One object holding every public project's status page snapshot.
[[durable_objects.bindings]]
name = "SNAPSHOTS"
class_name = "Snapshots"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Shard"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Snapshots"]

# Deployed environments: `wrangler deploy --env staging` and `--env production` create the
# Workers pulse-checker-staging and pulse-checker-production. Bindings and vars aren't
# inherited, so each environment lists them. Secrets (DATABASE_URL, CHECKER_HMAC_SECRET,
# ENCRYPTION_KEY) are set per environment with `wrangler secret put --env <name>`; locally
# they go in .dev.vars (see .dev.vars.example). See docs/DEPLOYMENT.md.

[env.staging]
vars = { ENVIRONMENT = "staging", DB_DRIVER = "neon-http" }

[env.staging.triggers]
crons = ["*/5 * * * *"]

[[env.staging.durable_objects.bindings]]
name = "SHARD"
class_name = "Shard"

[[env.staging.durable_objects.bindings]]
name = "SNAPSHOTS"
class_name = "Snapshots"

[env.production]
vars = { ENVIRONMENT = "production", DB_DRIVER = "neon-http" }

[env.production.triggers]
crons = ["*/5 * * * *"]

[[env.production.durable_objects.bindings]]
name = "SHARD"
class_name = "Shard"

[[env.production.durable_objects.bindings]]
name = "SNAPSHOTS"
class_name = "Snapshots"
